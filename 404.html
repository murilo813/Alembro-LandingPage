<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Alembro</title>
    <link rel="icon" href="assets/images/favicon.png" type="image/png">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Montserrat:wght@800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0f1115;
            --bg-card: #1a1d24;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #8b5cf6;
            --success: #10b981;
            --border: #2dd4bf20;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        .gradient-text {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header {
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 17, 21, 0.9);
            backdrop-filter: blur(10px);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
        }

        .error-code {
            font-family: 'Montserrat', sans-serif;
            font-size: 8rem;
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
        }

        .error-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .error-desc {
            color: var(--text-dim);
            font-size: 1.1rem;
            max-width: 500px;
            margin-bottom: 40px;
        }

        footer {
            text-align: center;
            padding: 40px 30px;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }

            .error-title {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo">
                <img src="assets/images/favicon.png" alt="" class="logo-img" style="width: 32px; display: none;">
                <div class="logo-text">
                    <h1>Alembro</h1>
                </div>
            </a>
        </nav>
    </header>

    <main>
        <h1 class="error-code gradient-text">404</h1>
        <h2 class="error-title">Página não encontrada</h2>
        <p class="error-desc">Parece que você se perdeu no caminho. A página que você está procurando não existe, foi
            movida ou a URL está incorreta.</p>
        <a href="index.html" class="btn-primary" style="padding: 15px 30px; font-size: 1.1rem;">
            <i class="fas fa-home"></i> Voltar para o Início
        </a>
    </main>

    <footer>
        <div class="container" style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
            <p>&copy; 2026 Alembro. Todos os direitos reservados.</p>
        </div>
    </footer>
</body>

</html>
